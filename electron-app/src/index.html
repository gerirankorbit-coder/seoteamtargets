<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rank Orbit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════════════════
       TOOLBAR — always visible; employee name filled in by portalAPI.notifyUser
       ════════════════════════════════════════════════════════════════════════ -->
  <div id="portal-toolbar" class="toolbar">

    <div class="tb-left">
      <div class="tb-logo">RO</div>
      <div class="tb-emp-name" id="tb-emp-name"></div>
    </div>

    <div class="tb-center">
      <!-- Visible only while sharing -->
      <div class="tb-status-row" id="tb-status-row" style="display:none">
        <div class="tb-dot" id="tb-status-dot"></div>
        <span class="tb-status-text" id="tb-status-text"></span>
      </div>
    </div>

    <div class="tb-right">
      <!-- intentionally empty — no settings needed (server URL is hardcoded) -->
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
