<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Pusher loaded from CDN. Bundled copy is at node_modules — renderer can't
       require() without nodeIntegration, so CDN is simpler for this app. -->
  <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
  <title>RO Screen Share</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Setup screen (first run) ── -->
  <div id="screen-setup" class="screen">
    <div class="logo-wrap">
      <div class="logo">RO</div>
      <div class="logo-title">Screen Share</div>
    </div>
    <div class="setup-form">
      <h2>Connect to your server</h2>
      <p class="sub">Enter your server URL and Employee ID to start screen sharing.</p>

      <div class="form-group">
        <label>Server URL</label>
        <input id="inp-server" type="url" placeholder="http://192.168.1.x:3000" autocomplete="url" />
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input id="inp-empid" type="text" placeholder="e.g. EMP001" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Your Name <span class="opt">(optional)</span></label>
        <input id="inp-name" type="text" placeholder="e.g. John Smith" autocomplete="name" />
      </div>
      <div id="setup-err" class="err-msg"></div>
      <button class="btn-primary" id="btn-setup-save" onclick="setupSave()">Connect</button>
    </div>
  </div>

  <!-- ── Source picker ── -->
  <div id="screen-sources" class="screen" style="display:none">
    <div class="screen-header">
      <div class="header-title">Select Screen to Share</div>
      <button class="btn-ghost" onclick="showSetup()">⚙ Settings</button>
    </div>

    <div id="perm-warning" class="warning-banner" style="display:none">
      ⚠ Screen recording permission required.
      <button class="btn-perm" onclick="openPerms()">Open Settings</button>
    </div>

    <div id="sources-grid" class="sources-grid">
      <div class="loading-ring" id="sources-loading"></div>
    </div>

    <div class="source-actions">
      <button class="btn-primary" id="btn-start-share" onclick="startSharing()" disabled>
        ▶ Start Sharing
      </button>
      <button class="btn-ghost" onclick="loadSources()">↻ Refresh</button>
    </div>
  </div>

  <!-- ── Sharing screen ── -->
  <div id="screen-sharing" class="screen" style="display:none">
    <div class="screen-header">
      <div class="header-title">Screen Sharing</div>
      <button class="btn-ghost" onclick="stopSharing(true)">Stop & Change Screen</button>
    </div>

    <div class="sharing-info">
      <div class="share-preview-wrap">
        <video id="preview-video" autoplay muted playsinline></video>
        <div class="preview-label" id="preview-source-name"></div>
      </div>

      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-text" id="status-text">Connecting…</div>
      </div>

      <div class="meta-row">
        <span id="meta-empid"></span>
        <span id="meta-name"></span>
      </div>

      <div id="share-err" class="err-msg"></div>

      <div class="sharing-actions">
        <button class="btn-danger" onclick="stopSharing(true)">⏹ Stop Sharing</button>
        <button class="btn-ghost"  onclick="reconnect()">⟳ Reconnect</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
