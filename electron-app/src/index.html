<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rank Orbit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════════════════
       TOOLBAR — shown in portal mode (44 px, sits above BrowserView)
       ════════════════════════════════════════════════════════════════════════ -->
  <div id="portal-toolbar" class="toolbar" style="display:none">

    <div class="tb-left">
      <div class="tb-logo">RO</div>
      <div class="tb-emp-name" id="tb-emp-name"></div>
    </div>

    <div class="tb-center">
      <!-- Visible only while sharing -->
      <div class="tb-status-row" id="tb-status-row" style="display:none">
        <div class="tb-dot" id="tb-status-dot"></div>
        <span class="tb-status-text" id="tb-status-text"></span>
      </div>
    </div>

    <div class="tb-right">
      <span class="tb-err" id="tb-err"></span>

      <!-- Shown when offline -->
      <button class="btn-start-working" id="btn-start-working" onclick="startWorking()">
        ▶&nbsp;Start Working
      </button>

      <!-- Shown while connecting / live -->
      <button class="btn-end-working" id="btn-end-working" onclick="endWorking()" style="display:none">
        ⏹&nbsp;End Working
      </button>

      <!-- Settings gear (returns to setup form) -->
      <button class="tb-settings" onclick="openSettings()" title="Settings">⚙</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       SETUP SCREEN — shown on first run or via Settings button
       ════════════════════════════════════════════════════════════════════════ -->
  <div id="setup-screen" class="screen" style="display:none">
    <div class="logo-wrap">
      <div class="logo">RO</div>
      <div class="logo-title">Rank Orbit</div>
    </div>

    <div class="setup-form">
      <h2>Connect to your server</h2>
      <p class="sub">Enter your server URL and Employee ID to get started.</p>

      <div class="form-group">
        <label>Server URL</label>
        <input id="inp-server" type="url" placeholder="https://your-server.com" autocomplete="url" />
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input id="inp-empid" type="text" placeholder="e.g. EMP001" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Your Name <span class="opt">(optional)</span></label>
        <input id="inp-name" type="text" placeholder="e.g. John Smith" autocomplete="name" />
      </div>

      <div id="setup-err" class="err-msg"></div>
      <button class="btn-primary" id="btn-setup-save" onclick="setupSave()">Connect</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
