<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Monitor — Rank Orbit</title>
<link rel="stylesheet" href="/style.css">
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
  .monitor-wrap { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }
  .monitor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .monitor-header h1 { font-size: 20px; font-weight: 800; }
  .monitor-header h1 span { color: var(--pink); }
  .monitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
  .member-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .member-tile.sharing { border-color: rgba(233,30,140,0.5); box-shadow: 0 0 20px rgba(233,30,140,0.1); }
  .tile-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .tile-avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }
  .tile-name { font-size: 13px; font-weight: 700; flex: 1; }
  .tile-status {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tile-status.live  { background: rgba(233,30,140,0.15); color: var(--pink); border: 1px solid rgba(233,30,140,0.3); }
  .tile-status.idle  { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .tile-video-wrap {
    background: #000; aspect-ratio: 16/9; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-video-wrap video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile-no-stream {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: var(--text-dim); font-size: 12px;
  }
  .tile-no-stream-icon { font-size: 28px; opacity: 0.3; }
  .tile-footer { padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  .btn-allow  { padding: 6px 14px; font-size: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; border: 1px solid rgba(22,163,74,0.4); background: rgba(22,163,74,0.12); color: #4ade80; transition: all 0.15s; }
  .btn-allow:hover  { background: rgba(22,163,74,0.25); }
  .btn-revoke { padding: 6px 14px; font-size: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; border: 1px solid rgba(239,68,68,0.35); background: rgba(239,68,68,0.1); color: #f87171; transition: all 0.15s; }
  .btn-revoke:hover { background: rgba(239,68,68,0.22); }
  .tile-footer-note { font-size: 10px; color: var(--text-dim); margin-left: auto; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 13px; }
  .page-footer { text-align: center; padding: 24px 0; color: var(--text-dim); font-size: 11px; }

  /* ── Expand button ── */
  .tile-video-wrap { position: relative; }
  .tile-expand-btn {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transition: opacity 0.18s, background 0.18s;
    z-index: 2; line-height: 1;
  }
  .tile-video-wrap:hover .tile-expand-btn { opacity: 1; }
  .tile-expand-btn:hover { background: rgba(233,30,140,0.55); border-color: rgba(233,30,140,0.5); }

  /* ── Fullscreen modal ── */
  .fs-overlay {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.95);
    align-items: center; justify-content: center; flex-direction: column;
    gap: 16px;
  }
  .fs-overlay.open { display: flex; }
  .fs-close {
    position: fixed; top: 20px; right: 24px;
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 20px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
    line-height: 1;
  }
  .fs-close:hover { background: rgba(239,68,68,0.35); border-color: rgba(239,68,68,0.5); }
  .fs-name {
    font-size: 15px; font-weight: 700; color: #fff;
    letter-spacing: 0.3px; text-align: center;
  }
  .fs-name span { color: var(--pink); }
  .fs-video-wrap {
    width: 90vw; max-width: 90vw;
    height: 85vh; max-height: 85vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; border-radius: 14px;
    overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
  }
  .fs-video-wrap video {
    max-width: 90vw; max-height: 85vh;
    width: auto; height: auto;
    object-fit: contain; display: block;
  }
  .fs-no-stream {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-dim); font-size: 14px; width: 100%; height: 100%;
  }
  .fs-no-stream-icon { font-size: 48px; opacity: 0.25; }

  /* ── Connection status badge ── */
  .conn-badge {
    position: absolute; top: 8px; left: 8px;
    display: none; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700;
    padding: 4px 9px; border-radius: 8px;
    z-index: 3; white-space: nowrap;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .conn-badge.show { display: flex; }
  .conn-badge.cb-live         { background: rgba(22,163,74,0.25);   border: 1px solid rgba(34,197,94,0.4);    color: #4ade80; }
  .conn-badge.cb-disconnected { background: rgba(239,68,68,0.2);    border: 1px solid rgba(239,68,68,0.4);    color: #f87171; }
  .conn-badge.cb-offline      { background: rgba(75,85,99,0.3);     border: 1px solid rgba(107,114,128,0.35); color: #9ca3af; }
  .conn-badge.cb-connecting   { background: rgba(234,179,8,0.18);   border: 1px solid rgba(234,179,8,0.35);   color: #fbbf24; }

  /* Tile border by connection state (override .sharing) */
  .member-tile.conn-live         { border-color: rgba(34,197,94,0.55);   box-shadow: 0 0 18px rgba(34,197,94,0.1); }
  .member-tile.conn-disconnected { border-color: rgba(239,68,68,0.55);   box-shadow: 0 0 18px rgba(239,68,68,0.1); }
  .member-tile.conn-offline      { border-color: rgba(107,114,128,0.35); box-shadow: none; }
  .member-tile.conn-connecting   { border-color: rgba(234,179,8,0.45);   box-shadow: 0 0 14px rgba(234,179,8,0.08); }

  /* ── Toast notifications ── */
  .toast-container {
    position: fixed; top: 72px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9998; pointer-events: none;
  }
  .toast {
    background: var(--surface-2); border: 1px solid rgba(239,68,68,0.35);
    border-radius: 10px; padding: 10px 16px;
    font-size: 12px; font-weight: 600; color: var(--text);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transform: translateX(120%); transition: transform 0.25s ease, opacity 0.25s ease;
    max-width: 300px; opacity: 0;
  }
  .toast.show { transform: translateX(0); opacity: 1; }

  /* ── Inactivity overlay ── */
  .inactivity-overlay {
    display: none; position: absolute; inset: 0;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 16px;
    z-index: 1; pointer-events: none;
    transition: background 0.4s ease;
  }
  .inactivity-overlay.active { display: flex; }
  .inactivity-overlay.warn   { background: rgba(255,165,0,0.30); }
  .inactivity-overlay.alert  { background: rgba(255,50,0,0.40);  }
  .inactivity-overlay.resume { background: rgba(34,197,94,0.25); }
  .inactiv-icon  { font-size: 26px; line-height: 1; }
  .inactiv-title { font-size: 13px; font-weight: 800; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
  .inactiv-sub   { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.82); }
</style>
</head>
<body>

<div class="topbar">
  <img src="/logo.png" alt="RO" class="topbar-logo" style="width:36px;height:36px;object-fit:contain;border-radius:10px" onerror="this.outerHTML='<div class=&quot;topbar-logo&quot;>RO</div>'">
  <div class="topbar-title">Rank <span>Orbit</span></div>
  <div class="topbar-right">
    <a href="/dashboard" style="font-size:12px;color:var(--text-muted);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:all 0.15s" onmouseover="this.style.color='var(--pink)'" onmouseout="this.style.color='var(--text-muted)'">← Dashboard</a>
    <span class="badge badge-pink">Monitor</span>
  </div>
</div>

<div class="monitor-wrap">
  <div class="monitor-header">
    <h1>Screen <span>Monitor</span></h1>
    <div style="font-size:12px;color:var(--text-dim)" id="last-refresh">Connecting…</div>
  </div>
  <div class="monitor-grid" id="monitor-grid">
    <div class="empty-state">Loading members…</div>
  </div>
</div>

<!-- Toast notifications -->
<div class="toast-container" id="toast-container"></div>

<!-- Fullscreen modal -->
<div class="fs-overlay" id="fs-overlay" onclick="fsOverlayClick(event)">
  <button class="fs-close" id="fs-close" onclick="closeFullscreen()">&#x2715;</button>
  <div class="fs-name" id="fs-name"></div>
  <div class="fs-video-wrap" id="fs-video-wrap">
    <video id="fs-video" autoplay muted playsinline></video>
    <div class="fs-no-stream" id="fs-no-stream" style="display:none">
      <div class="fs-no-stream-icon">🖥️</div>
      <div>No active screen share</div>
    </div>
  </div>
</div>

<div class="page-footer">Rank Orbit — Screen Monitor</div>

<script>
  const PUSHER_KEY     = 'fb8240c1bcccb2cde5d0';
  const PUSHER_CLUSTER = 'ap2';
  const RTC_CONFIG     = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  let members          = [];
  let permissions      = {}; // { username: true/false }
  let activeScreensMap = {}; // { username: true }
  let peerConnections  = {}; // { username: RTCPeerConnection }
  let videoStreams      = {}; // { username: MediaStream }
  let connStates       = {}; // { username: { state, since } }  states: idle|connecting|live|disconnected|offline

  // ── Pusher setup ──────────────────────────────────────────────────────────
  Pusher.logToConsole = false;
  const pusherClient  = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
  const channel       = pusherClient.subscribe('monitor-channel');

  channel.bind('signal', async (payload) => {
    const { type, data, fromUsername, targetUsername, fromRole } = payload;
    if (fromRole !== 'member') return; // ignore signals from other managers

    if (type === 'offer') {
      await handleOffer(fromUsername, data);
    } else if (type === 'ice-candidate' && targetUsername === 'manager') {
      const pc = peerConnections[fromUsername];
      if (pc && data) {
        try { await pc.addIceCandidate(new RTCIceCandidate(data)); } catch (e) {}
      }
    } else if (type === 'disconnect') {
      teardownPeer(fromUsername);
      setConnState(fromUsername, 'disconnected');
      updateTileStatus(fromUsername, false);
      delete activeScreensMap[fromUsername];
      renderLastRefresh();
    }
  });

  channel.bind('permission', (payload) => {
    const { targetUsername, allowed } = payload;
    permissions[targetUsername] = allowed;
    updateTilePermission(targetUsername, allowed);
  });

  // ── WebRTC handlers ───────────────────────────────────────────────────────
  async function handleOffer(username, offer) {
    teardownPeer(username); // clean up any old connection
    setConnState(username, 'connecting');

    const pc = new RTCPeerConnection(RTC_CONFIG);
    peerConnections[username] = pc;

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        sendSignal({ type: 'ice-candidate', data: e.candidate, targetUsername: username });
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
        setConnState(username, 'disconnected');
        updateTileStatus(username, false);
        delete activeScreensMap[username];
        renderLastRefresh();
      }
    };

    pc.ontrack = (e) => {
      const stream = e.streams[0];
      videoStreams[username] = stream;
      const video = document.getElementById('video-' + username);
      if (video) {
        video.srcObject = stream;
        video.play().catch(() => {});
      }
      // Sync fullscreen view if open for this member
      if (fsActiveUsername === username) {
        const fsVideo    = document.getElementById('fs-video');
        const fsNoStream = document.getElementById('fs-no-stream');
        fsVideo.srcObject = stream;
        fsVideo.play().catch(() => {});
        fsVideo.style.display    = 'block';
        fsNoStream.style.display = 'none';
      }
      activeScreensMap[username] = true;
      setConnState(username, 'live');
      updateTileStatus(username, true);
      inactStartTracking(username);
      renderLastRefresh();
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        teardownPeer(username);
        setConnState(username, 'disconnected');
        updateTileStatus(username, false);
        delete activeScreensMap[username];
        renderLastRefresh();
      }
    };

    try {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', data: answer, targetUsername: username });
    } catch (err) {
      console.error('WebRTC answer error:', err);
    }
  }

  function teardownPeer(username) {
    if (peerConnections[username]) {
      peerConnections[username].close();
      delete peerConnections[username];
    }
    inactStopTracking(username);
    const video = document.getElementById('video-' + username);
    if (video) { video.srcObject = null; }
    delete videoStreams[username];
  }

  async function sendSignal(payload) {
    await fetch('/api/monitor/signal', {
      method:      'POST',
      headers:     { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body:        JSON.stringify(payload),
    });
  }

  // ── Permission helpers ────────────────────────────────────────────────────
  async function togglePermission(username) {
    const current = permissions[username] || false;
    const allowed = !current;
    permissions[username] = allowed;
    updateTilePermission(username, allowed);
    await fetch('/api/monitor/allow', {
      method:      'POST',
      headers:     { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body:        JSON.stringify({ username, allowed }),
    });
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function updateTileStatus(username, isLive) {
    const tile   = document.getElementById('tile-' + username);
    const status = document.getElementById('status-' + username);
    const noStream = document.getElementById('nostream-' + username);
    if (!tile) return;
    if (isLive) {
      tile.classList.add('sharing');
      if (status)   { status.textContent = '● Live'; status.className = 'tile-status live'; }
      if (noStream) noStream.style.display = 'none';
    } else {
      tile.classList.remove('sharing');
      if (status)   { status.textContent = 'Idle'; status.className = 'tile-status idle'; }
      if (noStream) noStream.style.display = 'flex';
    }
  }

  function updateTilePermission(username, allowed) {
    const btn = document.getElementById('perm-btn-' + username);
    const note = document.getElementById('perm-note-' + username);
    if (!btn) return;
    if (allowed) {
      btn.textContent = 'Revoke';
      btn.className   = 'btn-revoke';
      if (note) note.textContent = 'Screen share allowed';
    } else {
      btn.textContent = 'Allow';
      btn.className   = 'btn-allow';
      if (note) note.textContent = 'Screen share blocked';
    }
  }

  function renderLastRefresh() {
    const el = document.getElementById('last-refresh');
    if (el) el.textContent = 'Live · ' + Object.keys(activeScreensMap).length + ' sharing · ' + new Date().toLocaleTimeString();
  }

  // ── Connection state helpers ───────────────────────────────────────────────
  function fmtTime(d) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function getDisplay(username) {
    const m = members.find(m => m.username === username);
    return m ? m.display : username;
  }

  function setConnState(username, state) {
    const prev    = (connStates[username] || {}).state || 'idle';
    const now     = new Date();
    connStates[username] = { state, since: now };

    // Update connection badge
    const badge = document.getElementById('conn-badge-' + username);
    if (badge) {
      badge.className = 'conn-badge';
      if (state === 'idle') {
        // hidden, no class
      } else {
        badge.classList.add('show');
        if (state === 'live') {
          if (prev === 'disconnected' || prev === 'offline') {
            // Briefly show "Reconnected" then settle into Live
            badge.classList.add('cb-connecting');
            badge.textContent = '✅ Reconnected at ' + fmtTime(now);
            setTimeout(() => {
              if ((connStates[username] || {}).state === 'live') {
                badge.className = 'conn-badge show cb-live';
                badge.textContent = '🟢 Live';
              }
            }, 3000);
          } else {
            badge.classList.add('cb-live');
            badge.textContent = '🟢 Live';
          }
        } else if (state === 'disconnected') {
          badge.classList.add('cb-disconnected');
          badge.textContent = '🔴 Disconnected at ' + fmtTime(now);
        } else if (state === 'offline') {
          badge.classList.add('cb-offline');
          badge.textContent = '⚫ Offline since ' + fmtTime(now);
        } else if (state === 'connecting') {
          badge.classList.add('cb-connecting');
          badge.textContent = '🟡 Connecting…';
        }
      }
    }

    // Update tile border class
    const tile = document.getElementById('tile-' + username);
    if (tile) {
      tile.classList.remove('conn-live', 'conn-disconnected', 'conn-offline', 'conn-connecting');
      if (state !== 'idle') tile.classList.add('conn-' + state);
    }

    // Toast: member went offline (only on first transition from live/connecting)
    if (state === 'disconnected' && (prev === 'live' || prev === 'connecting')) {
      showToast('🔴 ' + getDisplay(username) + ' went offline at ' + fmtTime(now));
    }
  }

  function showToast(message, duration) {
    const ms        = duration || 5000;
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }, ms);
  }

  function initials(name) {
    return name.split(' ').map(w => w[0] || '').join('').toUpperCase().slice(0, 2);
  }

  function renderGrid() {
    const grid = document.getElementById('monitor-grid');
    if (!members.length) {
      grid.innerHTML = '<div class="empty-state">No team members found.</div>';
      return;
    }
    grid.innerHTML = members.map(m => {
      const isLive    = !!activeScreensMap[m.username];
      const isAllowed = !!permissions[m.username];
      return `
        <div class="member-tile${isLive ? ' sharing' : ''}" id="tile-${m.username}">
          <div class="tile-header">
            <div class="tile-avatar">${initials(m.display)}</div>
            <div class="tile-name">${escHtml(m.display)}</div>
            <div class="tile-status ${isLive ? 'live' : 'idle'}" id="status-${m.username}">${isLive ? '● Live' : 'Idle'}</div>
          </div>
          <div class="tile-video-wrap">
            <video id="video-${m.username}" autoplay muted playsinline style="display:block"></video>
            <div class="tile-no-stream" id="nostream-${m.username}" style="display:${isLive ? 'none' : 'flex'}">
              <div class="tile-no-stream-icon">🖥️</div>
              <div>No screen share</div>
            </div>
            <button class="tile-expand-btn" title="Fullscreen" onclick="openFullscreen('${m.username}','${escHtml(m.display)}')">⛶</button>
            <div class="inactivity-overlay" id="inactiv-${m.username}"></div>
            <div class="conn-badge" id="conn-badge-${m.username}"></div>
          </div>
          <div class="tile-footer">
            <button id="perm-btn-${m.username}" class="${isAllowed ? 'btn-revoke' : 'btn-allow'}" onclick="togglePermission('${m.username}')">
              ${isAllowed ? 'Revoke' : 'Allow'}
            </button>
            <span class="tile-footer-note" id="perm-note-${m.username}">${isAllowed ? 'Screen share allowed' : 'Screen share blocked'}</span>
          </div>
        </div>`;
    }).join('');

    // Reattach any live streams to video elements
    Object.entries(videoStreams).forEach(([uname, stream]) => {
      const video = document.getElementById('video-' + uname);
      if (video && !video.srcObject) { video.srcObject = stream; video.play().catch(() => {}); }
    });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Data loading ──────────────────────────────────────────────────────────
  async function loadActiveScreens() {
    try {
      const res  = await fetch('/api/monitor/active-screens', { credentials: 'same-origin' });
      const list = await res.json();
      activeScreensMap = {};
      list.forEach(s => { activeScreensMap[s.username] = true; });
    } catch (e) {}
  }

  async function init() {
    try {
      const [membRes] = await Promise.all([
        fetch('/api/members', { credentials: 'same-origin' }),
        loadActiveScreens(),
      ]);
      members = await membRes.json();
    } catch (e) {
      members = [];
    }
    renderGrid();
    renderLastRefresh();
  }

  // ── Fullscreen view ───────────────────────────────────────────────────────
  let fsActiveUsername = null;

  function openFullscreen(username, displayName) {
    fsActiveUsername = username;

    // Set name label
    document.getElementById('fs-name').innerHTML = escHtml(displayName) + '<span> — Screen View</span>';

    // Attach stream to fullscreen video if available
    const fsVideo   = document.getElementById('fs-video');
    const fsNoStream = document.getElementById('fs-no-stream');
    const stream    = videoStreams[username];

    if (stream) {
      fsVideo.srcObject = stream;
      fsVideo.play().catch(() => {});
      fsVideo.style.display = 'block';
      fsNoStream.style.display = 'none';
    } else {
      fsVideo.srcObject = null;
      fsVideo.style.display = 'none';
      fsNoStream.style.display = 'flex';
    }

    document.getElementById('fs-overlay').classList.add('open');
    document.addEventListener('keydown', fsKeyHandler);
  }

  function closeFullscreen() {
    const fsVideo = document.getElementById('fs-video');
    fsVideo.srcObject = null;
    document.getElementById('fs-overlay').classList.remove('open');
    document.removeEventListener('keydown', fsKeyHandler);
    fsActiveUsername = null;
  }

  function fsOverlayClick(e) {
    // Close if clicking the dark backdrop directly (not the video/controls)
    if (e.target === document.getElementById('fs-overlay')) closeFullscreen();
  }

  function fsKeyHandler(e) {
    if (e.key === 'Escape') closeFullscreen();
  }

  // ── Inactivity detection ─────────────────────────────────────────────────
  const INACTIV_SAMPLE_W  = 64;    // downscale width for fast pixel diff
  const INACTIV_SAMPLE_H  = 36;    // downscale height
  const INACTIV_PIX_DIFF  = 30;    // per-channel sum threshold to count a pixel as changed
  const INACTIV_MOVE_PCT  = 0.005; // 0.5% of pixels must change = "motion detected"
  const INACTIV_SAMPLE_MS = 10000; // frame sample interval (10 s)
  const INACTIV_WARN_MS   = 3 * 60 * 1000; // 3 minutes → warn
  const INACTIV_ALERT_MS  = 5 * 60 * 1000; // 5 minutes → alert

  let inactivityStates = {};
  // { username: { lastActiveAt, prevFrame, warnToasted, alertToasted, level, timerId } }

  function inactCaptureFrame(video) {
    try {
      const canvas  = document.createElement('canvas');
      canvas.width  = INACTIV_SAMPLE_W;
      canvas.height = INACTIV_SAMPLE_H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, INACTIV_SAMPLE_W, INACTIV_SAMPLE_H);
      return ctx.getImageData(0, 0, INACTIV_SAMPLE_W, INACTIV_SAMPLE_H).data;
    } catch (e) { return null; }
  }

  function inactCompareFrames(prev, curr) {
    if (!prev || !curr || prev.length !== curr.length) return 1; // can't compare → assume active
    const total = prev.length / 4;
    let changed = 0;
    for (let i = 0; i < prev.length; i += 4) {
      if (Math.abs(prev[i] - curr[i]) + Math.abs(prev[i+1] - curr[i+1]) + Math.abs(prev[i+2] - curr[i+2]) > INACTIV_PIX_DIFF) {
        changed++;
      }
    }
    return changed / total; // fraction of changed pixels
  }

  function inactSetOverlay(username, level) {
    const el = document.getElementById('inactiv-' + username);
    if (!el) return;
    el.className = 'inactivity-overlay';
    if (!level) return; // hide

    el.classList.add('active');
    if (level === 'warn') {
      el.classList.add('warn');
      el.innerHTML = '<div class="inactiv-icon">⚠️</div>'
                   + '<div class="inactiv-title">No activity for 3 mins</div>'
                   + '<div class="inactiv-sub">Screen may be idle</div>';
    } else if (level === 'alert') {
      el.classList.add('alert');
      el.innerHTML = '<div class="inactiv-icon">🚨</div>'
                   + '<div class="inactiv-title">Screen not in use for 5 mins</div>'
                   + '<div class="inactiv-sub">Member may be away</div>';
    } else if (level === 'resume') {
      el.classList.add('resume');
      el.innerHTML = '<div class="inactiv-icon">✅</div>'
                   + '<div class="inactiv-title">' + escHtml(getDisplay(username)) + ' is active again</div>';
      setTimeout(() => {
        if (el.classList.contains('resume')) el.className = 'inactivity-overlay'; // hide
      }, 2500);
    }
  }

  function inactTick(username) {
    const video = document.getElementById('video-' + username);
    const st    = inactivityStates[username];
    if (!st || !video || video.readyState < 2 || video.videoWidth === 0) return;

    const currFrame  = inactCaptureFrame(video);
    const movePct    = inactCompareFrames(st.prevFrame, currFrame);
    st.prevFrame     = currFrame;
    const isActive   = movePct >= INACTIV_MOVE_PCT;
    const wasInactiv = st.level === 'warn' || st.level === 'alert';

    if (isActive) {
      if (wasInactiv) {
        // Activity has resumed — clear overlay, show brief green flash
        st.level        = null;
        st.warnToasted  = false;
        st.alertToasted = false;
        inactSetOverlay(username, 'resume');
        showToast('✅ ' + getDisplay(username) + ' is active again', 5000);
      }
      st.lastActiveAt = Date.now();
    } else {
      // No significant motion detected
      const elapsed = Date.now() - st.lastActiveAt;

      if (elapsed >= INACTIV_ALERT_MS) {
        if (st.level !== 'alert') {
          st.level = 'alert';
          inactSetOverlay(username, 'alert');
          if (!st.alertToasted) {
            st.alertToasted = true;
            showToast('🚨 ' + getDisplay(username) + ' — Screen idle for 5 minutes!', 8000);
          }
        }
      } else if (elapsed >= INACTIV_WARN_MS) {
        if (st.level !== 'warn' && st.level !== 'alert') {
          st.level = 'warn';
          inactSetOverlay(username, 'warn');
          if (!st.warnToasted) {
            st.warnToasted = true;
            showToast('⚠️ ' + getDisplay(username) + ' — No activity for 3 minutes', 8000);
          }
        }
      }
    }
  }

  function inactStartTracking(username) {
    inactStopTracking(username); // clear any previous tracker first
    inactivityStates[username] = {
      lastActiveAt: Date.now(),
      prevFrame:    null,
      warnToasted:  false,
      alertToasted: false,
      level:        null,
      timerId:      setInterval(() => inactTick(username), INACTIV_SAMPLE_MS),
    };
  }

  function inactStopTracking(username) {
    const st = inactivityStates[username];
    if (st) {
      clearInterval(st.timerId);
      delete inactivityStates[username];
    }
    inactSetOverlay(username, null); // hide any overlay
  }

  init();
  setInterval(async () => {
    await loadActiveScreens();
    members.forEach(m => {
      const cs      = connStates[m.username] || {};
      const isLive  = !!activeScreensMap[m.username];

      // Server says not active but we still think live → they dropped without a signal
      if (!isLive && cs.state === 'live') {
        setConnState(m.username, 'disconnected');
        updateTileStatus(m.username, false);
      }

      // Escalate: disconnected for more than 30 s → offline
      if (cs.state === 'disconnected' && cs.since && (Date.now() - cs.since.getTime() > 30000)) {
        setConnState(m.username, 'offline');
      }
    });
    renderLastRefresh();
  }, 10000);
</script>
</body>
</html>
