<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank Orbit — SEO Team Progress</title>
<script>/* Theme before first paint — see /theme.js */(function(){var d=document.documentElement;try{var s=localStorage,u=s.getItem('ro_theme_user'),t=(u&&s.getItem('ro_theme:'+u))||s.getItem('ro_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t)}catch(e){d.setAttribute('data-theme','light')}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/design-system.css">
<script src="/theme.js"></script>
<style>
  /* Clean SaaS look (inspired by trackcontent.ai): soft blue wash at the top, white page,
     solid near-black headline, royal-blue accent, bordered white cards, light-grey stats band. */
  body { overflow-x: hidden; background: linear-gradient(180deg, var(--ro-hero) 0, var(--ro-bg) 520px) no-repeat, var(--ro-bg); }


  /* ── Hero ── */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 48px 20px 88px;
    position: relative; z-index: 1;
  }
  .logo-ring { margin: 0 auto 28px; }
  .logo-box {
    width: 64px; height: 64px;
    background: var(--ro-accent-fill);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--ro-on-accent);
    letter-spacing: -0.5px;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--ro-accent) 28%, transparent);
  }
  .hero-eyebrow {
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ro-accent);
    margin-bottom: 14px;
  }
  .hero-title {
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--ro-text);
    margin-bottom: 14px;
  }
  .hero-title-accent { color: var(--ro-accent); }
  .hero-subtitle {
    font-size: 17px; line-height: 1.6;
    color: var(--ro-muted);
    margin-bottom: 40px;
    max-width: 420px;
  }

  .cta-group { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .cta-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 22px 32px;
    background: var(--ro-surface);
    border: 1px solid var(--ro-border);
    border-radius: var(--radius-card);
    box-shadow: var(--ro-shadow);
    text-decoration: none;
    color: var(--ro-text);
    transition: border-color .15s, box-shadow .15s, transform .15s;
    min-width: 200px;
  }
  .cta-card:hover { transform: translateY(-2px); border-color: var(--ro-accent); box-shadow: 0 8px 24px color-mix(in srgb, var(--ro-accent) 14%, transparent); }
  .cta-card.primary { border-color: color-mix(in srgb, var(--ro-accent) 45%, var(--ro-border)); }
  .cta-icon { font-size: 26px; }
  .cta-label { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .cta-desc  { font-size: 12.5px; color: var(--ro-muted); }

  /* ── Stats band ── */
  .stats-strip {
    display: flex; gap: 48px; justify-content: center; flex-wrap: wrap;
    margin-top: 56px;
    padding: 28px 40px;
    background: var(--ro-surface-2);
    border: 1px solid var(--ro-border);
    border-radius: var(--radius-card);
    width: 100%; max-width: 560px;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; color: var(--ro-text); }
  .stat-lbl { font-size: 12px; color: var(--ro-muted); margin-top: 2px; }

  /* ── Footer ── */
  .page-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    text-align: center; padding: 12px;
    color: var(--text-dim); font-size: 11px;
    z-index: 1;
  }
  .page-footer strong { color: var(--text-muted); }
</style>
</head>
<body>


<div style="position:fixed;top:16px;right:16px;z-index:300">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
</div>

<div class="hero">
  <div class="logo-ring">
    <div class="logo-box">RO</div>
  </div>

  <p class="hero-eyebrow">SEO Agency Internal Tool</p>
  <h1 class="hero-title">Rank <span class="hero-title-accent">Orbit</span></h1>
  <p class="hero-subtitle">Team Progress Tracking — daily tasks, targets, and analytics in one place.</p>

  <div class="cta-group">
    <a href="/login?portal=member" class="cta-card primary">
      <span class="cta-icon">👤</span>
      <span class="cta-label">Member Portal</span>
      <span class="cta-desc">Log daily task progress</span>
    </a>
    <a href="/login?portal=manager" class="cta-card secondary">
      <span class="cta-icon">📊</span>
      <span class="cta-label">Manager Dashboard</span>
      <span class="cta-desc">View team analytics</span>
    </a>
  </div>

  <div class="stats-strip">
    <div class="stat"><div class="stat-num" id="stat-members">–</div><div class="stat-lbl">Team Members</div></div>
    <div class="stat"><div class="stat-num" id="stat-tasks">–</div><div class="stat-lbl">Active Tasks</div></div>
    <div class="stat"><div class="stat-num" id="stat-entries">–</div><div class="stat-lbl">Entries Logged</div></div>
  </div>
</div>

<div class="page-footer">Built by <strong>Abdullah Saleem</strong></div>

<script>
  // Live numbers from the database (counts only); "–" stays if they cannot load
  fetch('/api/public/stats').then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    const fmt = n => Number(n).toLocaleString('en-US');
    document.getElementById('stat-members').textContent = fmt(d.members);
    document.getElementById('stat-tasks').textContent   = fmt(d.tasks);
    document.getElementById('stat-entries').textContent = fmt(d.entries);
  }).catch(() => {});

</script>
</body>
</html>
