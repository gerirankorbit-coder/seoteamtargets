<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Monitor — Rank Orbit</title>
  <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0f14;
      --surface:    #13161e;
      --surface-2:  #1a1d27;
      --border:     rgba(255,255,255,0.07);
      --text:       #e8eaf0;
      --text-muted: #6b7280;
      --pink:       #e91e8c;
      --pink-dim:   rgba(233,30,140,0.12);
      --green:      #22c55e;
      --amber:      #f59e0b;
      --red:        #ef4444;
      --blue:       #3b82f6;
      --sidebar-w:  260px;
      --topbar-h:   54px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
                 font-family: 'Inter', system-ui, sans-serif; font-size: 14px; overflow: hidden; }

    /* ── Layout ── */
    #layout { display: flex; height: 100vh; }

    /* ── Topbar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 14px;
      z-index: 100;
    }
    .tb-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; }
    .tb-brand { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .tb-brand span { color: var(--pink); }
    .tb-sep { width: 1px; height: 20px; background: var(--border); }
    .tb-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .tb-user { font-size: 12px; color: var(--text-muted); }
    .tb-link {
      font-size: 12px; font-weight: 700; color: var(--pink); text-decoration: none;
      padding: 5px 12px; border: 1px solid rgba(233,30,140,0.35); border-radius: 8px;
      background: var(--pink-dim); transition: background 0.15s;
    }
    .tb-link:hover { background: rgba(233,30,140,0.22); }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 90;
    }
    .sb-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sb-head h3 { font-size: 11px; font-weight: 700; text-transform: uppercase;
                  letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 10px; }
    .sb-search {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); padding: 7px 10px; font-size: 13px; outline: none;
    }
    .sb-search:focus { border-color: rgba(233,30,140,0.4); }

    .emp-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .emp-list::-webkit-scrollbar { width: 3px; }
    .emp-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .emp-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .emp-item:hover { background: rgba(255,255,255,0.04); }
    .emp-item.selected { background: var(--pink-dim); border-left-color: var(--pink); }
    .emp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .emp-dot.live       { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .emp-dot.connecting { background: var(--amber); animation: pulse 1.2s infinite; }
    .emp-dot.offline    { background: #374151; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .emp-info { flex: 1; min-width: 0; }
    .emp-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emp-id   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .emp-del  { opacity: 0; background: none; border: none; color: var(--red);
                cursor: pointer; font-size: 16px; padding: 2px 4px;
                border-radius: 4px; transition: opacity 0.15s, background 0.15s; }
    .emp-item:hover .emp-del { opacity: 1; }
    .emp-del:hover { background: rgba(239,68,68,0.1); }

    .sb-add {
      padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .btn-add-emp {
      width: 100%; padding: 8px; background: var(--pink-dim);
      border: 1px solid rgba(233,30,140,0.35); border-radius: 8px;
      color: var(--pink); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-add-emp:hover { background: rgba(233,30,140,0.22); }

    /* ── Main ── */
    /* position:fixed gives #main a hard pixel-perfect bounding box so that
       overflow-y:scroll is unambiguous and mouse-wheel events are reliably
       delivered to this element rather than falling through to the flex
       container / body (both of which have overflow:hidden).              */
    #main {
      position: fixed;
      top:    var(--topbar-h);
      left:   var(--sidebar-w);
      right:  0;
      bottom: 0;
      overflow-y: scroll;
      padding: 20px;
    }
    #main::-webkit-scrollbar       { width: 8px; }
    #main::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    #main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    #main::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

    /* ── No employees ── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: calc(100vh - var(--topbar-h) - 40px);
      gap: 12px; color: var(--text-muted);
    }
    #empty-state .icon { font-size: 52px; }
    #empty-state p { font-size: 15px; }
    #empty-state .hint { font-size: 13px; }

    /* ── Video grid ── */
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      align-content: start;   /* rows pack to top; don't stretch to fill remaining height */
    }

    /* ── Employee card ── */
    .emp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .emp-card.card-live { border-color: rgba(34,197,94,0.35); }
    .emp-card.card-connecting { border-color: rgba(245,158,11,0.3); }

    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .card-name { font-weight: 700; font-size: 13px; flex: 1; }
    .card-id   { font-size: 11px; color: var(--text-muted); }
    .card-status-badge {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; flex-shrink: 0;
    }
    .badge-live { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-connecting { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-offline { background: rgba(255,255,255,0.06); color: var(--text-muted); }

    /* Video wrapper 16:9 */
    .card-video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #0a0c10;
    }
    .card-video-wrap video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #0a0c10;
    }
    .card-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-muted);
    }
    .card-placeholder .ph-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: var(--text-muted);
    }
    .card-placeholder p { font-size: 12px; }

    .card-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-top: 1px solid var(--border);
    }
    .btn-card {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-muted);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-card:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-card.btn-disconnect { color: var(--red); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
    .btn-card.btn-disconnect:hover { background: rgba(239,68,68,0.14); }
    .btn-card.btn-fs { margin-left: auto; }
    /* Subtle force-reconnect icon button — sits right of fullscreen button */
    .btn-card.btn-reconnect { padding: 6px 8px; font-size: 15px; opacity: 0.5; transition: opacity 0.15s, background 0.15s; }
    .btn-card.btn-reconnect:hover { opacity: 1; }
    .card-err { font-size: 11px; color: var(--red); flex: 1; padding: 0 4px; }

    /* ── Add Employee Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; width: 360px; max-width: 90vw;
    }
    .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600;
                        color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 9px 12px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: rgba(233,30,140,0.5); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel {
      padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-muted); cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.08); }
    .btn-save {
      padding: 8px 20px; background: var(--pink); border: none;
      border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 700;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.85; }
    .modal-err { font-size: 12px; color: var(--red); margin-top: 6px; }

    /* ── Fullscreen Modal ── */
    #fullscreen-modal {
      display: none; position: fixed; inset: 0;
      background: #000; z-index: 300;
      flex-direction: column;
    }
    #fullscreen-modal.show { display: flex; }
    #fs-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: rgba(0,0,0,0.7);
      position: absolute; top: 0; left: 0; right: 0; z-index: 1;
    }
    #fs-name { font-weight: 700; font-size: 14px; }
    #fs-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    #fs-close {
      margin-left: auto; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      color: #fff; padding: 6px 14px; cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    #fs-close:hover { background: rgba(255,255,255,0.2); }
    #fs-video {
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 18px; font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 500;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    /* ── Checkout overlay (shown on card video when employee is on break) ── */
    .checkout-overlay {
      position: absolute; inset: 0; z-index: 2;
      background: rgba(0,0,0,0.72);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; pointer-events: none;
    }
    .co-icon  { font-size: 30px; line-height: 1; }
    .co-label { font-size: 15px; font-weight: 700; color: #fb923c; letter-spacing: 0.01em; }
    .co-time  { font-size: 11px; color: rgba(255,255,255,0.55); }
    /* When employee checks back in — flash green then overlay disappears */
    .checkout-overlay.co-checkin .co-label { color: #4ade80; }

    /* ── Screen-lock overlay (z-index 3 sits above checkout overlay at 2) ── */
    .lock-overlay {
      position: absolute; inset: 0; z-index: 3;
      background: rgba(0,0,0,0.82);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; pointer-events: none;
    }
    .lock-overlay .lo-icon  { font-size: 30px; line-height: 1; }
    .lock-overlay .lo-label { font-size: 15px; font-weight: 700; color: #94a3b8; }
  </style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <img src="/logo.png" class="tb-logo"
       onerror="this.outerHTML='<div style=&quot;width:30px;height:30px;background:var(--pink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px&quot;>RO</div>'" />
  <div class="tb-brand">Rank <span>Orbit</span></div>
  <div class="tb-sep"></div>
  <div class="tb-title">🖥 Screen Monitor</div>
  <div class="tb-right">
    <span class="tb-user" id="tb-user"></span>
    <a href="/dashboard" class="tb-link">← Dashboard</a>
  </div>
</div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sb-head">
    <h3>Employees</h3>
    <input class="sb-search" type="text" placeholder="Search by name or ID…" id="sb-search" />
  </div>
  <div class="emp-list" id="emp-list"></div>
  <div class="sb-add">
    <button class="btn-add-emp" onclick="openAddModal()">+ Add Employee</button>
  </div>
</aside>

<!-- Main grid -->
<div id="main">
  <div id="empty-state" style="display:none">
    <div class="icon">👥</div>
    <p>No employees added yet</p>
    <p class="hint">Click <strong>+ Add Employee</strong> to get started</p>
  </div>
  <div id="video-grid"></div>
</div>

<!-- Add Employee Modal -->
<div class="modal-overlay" id="add-modal" onclick="closeAddModal(event)">
  <div class="modal">
    <h3>Add Employee</h3>
    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="inp-name" placeholder="e.g. John Smith" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Employee ID</label>
      <input type="text" id="inp-id" placeholder="e.g. EMP001" autocomplete="off" />
      <div class="modal-err" id="add-err"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" onclick="saveEmployee()">Add</button>
    </div>
  </div>
</div>

<!-- Fullscreen Modal -->
<div id="fullscreen-modal">
  <div id="fs-topbar">
    <span id="fs-name"></span>
    <span id="fs-badge" class="badge-live"></span>
    <button id="fs-close" onclick="closeFullscreen()">✕ Close</button>
  </div>
  <video id="fs-video" autoplay muted playsinline></video>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
// Pusher is kept only for the auto-discovery notifications channel
// (employee-online / employee-offline). All video is handled by LiveKit.
let pusherClient = null;
let employees    = [];   // [{ name, id }]
const rooms      = {};   // id → { room, videoTrack, state, intentionalDisconnect }
let fsEmployeeId = null;
const connectingTimers = {}; // empId → setTimeout handle (auto force-reconnect after 15 s)

// ── Boot ──────────────────────────────────────────────────────────────────────
(async function boot() {
  // Auth check + username display
  try {
    const r = await fetch('/api/me', { credentials: 'same-origin' });
    if (!r.ok) { location.href = '/login'; return; }
    const me = await r.json();
    if (me.role !== 'manager' && me.role !== 'assistant') { location.href = '/login'; return; }
    document.getElementById('tb-user').textContent = me.display || me.username;
  } catch { location.href = '/login'; return; }

  // Load employees from localStorage, render, connect LiveKit rooms
  employees = loadEmployees();
  renderSidebar();
  renderGrid();
  employees.forEach(e => connectEmployee(e));

  // Start attendance polling — shows checkout overlay on cards
  pollAttendance();

  // ── Auto-discovery via Pusher notifications channel ───────────────────────
  // private-screenshare-notifications fires employee-online/-offline when the
  // employee Electron app calls /api/screenshare/signal. This is the only
  // Pusher channel used here — WebRTC signaling is gone entirely.
  try {
    const cfgR = await fetch('/api/screenshare/config', { credentials: 'same-origin' });
    const cfg  = await cfgR.json();
    if (cfg.pusherKey) {
      pusherClient = new Pusher(cfg.pusherKey, {
        cluster:         cfg.pusherCluster,
        activityTimeout: 20000,
        pongTimeout:     10000,
        channelAuthorization: {
          endpoint:  '/api/screenshare/pusher-auth',
          transport: 'ajax',
        },
      });
      const notifCh = pusherClient.subscribe('private-screenshare-notifications');
      notifCh.bind('employee-online', ({ employeeId, employeeName }) => {
        autoAddEmployee(employeeId, employeeName || employeeId);
      });
      notifCh.bind('employee-offline', ({ employeeId }) => {
        // LiveKit ParticipantDisconnected handles this too; belt-and-braces update
        clearVideoEl(employeeId);
        setCardState(employeeId, 'offline');
      });
      notifCh.bind('employee-locked',   ({ employeeId }) => setLockOverlay(employeeId, true));
      notifCh.bind('employee-unlocked', ({ employeeId }) => setLockOverlay(employeeId, false));
    }
  } catch (e) {
    console.warn('[boot] Pusher notifications unavailable — auto-discovery disabled:', e.message);
  }

  document.getElementById('sb-search').addEventListener('input', renderSidebar);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeFullscreen(); closeAddModal(); }
  });
})();

// ── LocalStorage ──────────────────────────────────────────────────────────────
function loadEmployees() {
  try { return JSON.parse(localStorage.getItem('ro_screenshare_employees') || '[]'); }
  catch { return []; }
}
function saveEmployees() {
  localStorage.setItem('ro_screenshare_employees', JSON.stringify(employees));
}

// ── Add / remove employees ────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-id').value   = '';
  document.getElementById('add-err').textContent = '';
  document.getElementById('add-modal').classList.add('show');
  setTimeout(() => document.getElementById('inp-name').focus(), 50);
}
function closeAddModal(e) {
  if (e && e.target !== document.getElementById('add-modal')) return;
  document.getElementById('add-modal').classList.remove('show');
}

// ── Auto-add from notification channel ───────────────────────────────────────
function autoAddEmployee(id, name) {
  if (employees.some(e => e.id === id)) {
    // Already in the list — ensure a LiveKit room is connected
    if (!rooms[id]) connectEmployee({ id, name });
    return;
  }
  const emp = { id, name };
  employees.push(emp);
  saveEmployees();
  renderSidebar();
  renderGrid();
  connectEmployee(emp);
  console.log('[autodiscover] added employee:', id, name);
}

function saveEmployee() {
  const name = document.getElementById('inp-name').value.trim();
  const id   = document.getElementById('inp-id').value.trim();
  const err  = document.getElementById('add-err');

  if (!name || !id) { err.textContent = 'Both fields are required.'; return; }
  if (employees.some(e => e.id === id)) { err.textContent = 'Employee ID already exists.'; return; }

  const emp = { name, id };
  employees.push(emp);
  saveEmployees();
  renderSidebar();
  renderGrid();
  connectEmployee(emp);
  document.getElementById('add-modal').classList.remove('show');
  showToast(`${name} added`);
}

function removeEmployee(id) {
  const emp = employees.find(e => e.id === id);
  if (!emp) return;
  if (!confirm(`Remove ${emp.name}?`)) return;

  disconnectEmployee(id);

  employees = employees.filter(e => e.id !== id);
  saveEmployees();
  renderSidebar();
  renderGrid();
  showToast(`${emp.name} removed`);
}

// ── Sidebar render ────────────────────────────────────────────────────────────
function renderSidebar() {
  const q    = (document.getElementById('sb-search').value || '').toLowerCase();
  const list = document.getElementById('emp-list');
  const filtered = employees.filter(e =>
    e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q)
  );

  list.innerHTML = filtered.map(e => {
    const state = (rooms[e.id] || {}).state || 'offline';
    return `
      <div class="emp-item" id="sb-${e.id}">
        <div class="emp-dot ${state}"></div>
        <div class="emp-info">
          <div class="emp-name">${esc(e.name)}</div>
          <div class="emp-id">${esc(e.id)}</div>
        </div>
        <button class="emp-del" onclick="event.stopPropagation();removeEmployee('${esc(e.id)}')" title="Remove">✕</button>
      </div>`;
  }).join('') || '<div style="padding:16px;color:var(--text-muted);font-size:12px;text-align:center">No employees found</div>';
}

// ── Video grid render ─────────────────────────────────────────────────────────
function renderGrid() {
  const grid  = document.getElementById('video-grid');
  const empty = document.getElementById('empty-state');

  if (!employees.length) {
    empty.style.display = 'flex';
    grid.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  // Add cards for new employees, don't re-render existing ones
  employees.forEach(e => {
    if (!document.getElementById(`card-${e.id}`)) {
      grid.insertAdjacentHTML('beforeend', buildCard(e));
    }
  });

  // Remove cards for deleted employees
  grid.querySelectorAll('.emp-card').forEach(card => {
    const id = card.dataset.id;
    if (!employees.find(e => e.id === id)) card.remove();
  });
}

function buildCard(emp) {
  return `
    <div class="emp-card" id="card-${esc(emp.id)}" data-id="${esc(emp.id)}">
      <div class="card-header">
        <div class="card-dot offline" id="dot-${esc(emp.id)}"></div>
        <div class="card-name">${esc(emp.name)}</div>
        <div class="card-id">${esc(emp.id)}</div>
        <span class="card-status-badge badge-offline" id="badge-${esc(emp.id)}">Offline</span>
      </div>
      <div class="card-video-wrap">
        <div class="card-placeholder" id="ph-${esc(emp.id)}">
          <div class="ph-avatar">${esc(emp.name[0]?.toUpperCase() || '?')}</div>
          <p>Waiting for stream…</p>
        </div>
        <video id="video-${esc(emp.id)}" autoplay muted playsinline style="display:none"></video>
        <div class="checkout-overlay" id="co-${esc(emp.id)}" style="display:none">
          <div class="co-icon">⏸</div>
          <div class="co-label" id="co-label-${esc(emp.id)}">Checked Out</div>
          <div class="co-time"  id="co-time-${esc(emp.id)}"></div>
        </div>
        <div class="lock-overlay" id="lo-${esc(emp.id)}" style="display:none">
          <div class="lo-icon">🔒</div>
          <div class="lo-label">Screen Locked</div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-card btn-disconnect" id="btn-disc-${esc(emp.id)}"
                onclick="disconnectEmployee('${esc(emp.id)}')" style="display:none">⏹ Disconnect</button>
        <span class="card-err" id="err-${esc(emp.id)}"></span>
        <button class="btn-card btn-fs"        onclick="openFullscreen('${esc(emp.id)}')"  title="Fullscreen">⛶</button>
        <button class="btn-card btn-reconnect" onclick="forceReconnect('${esc(emp.id)}')" title="Force reconnect">↺</button>
      </div>
    </div>`;
}

// ── LiveKit: connect one room per employee ────────────────────────────────────
async function connectEmployee(emp) {
  if (rooms[emp.id]) return; // already connecting / connected

  // Fetch a manager token for this employee's room
  let token, livekitUrl;
  try {
    const r = await fetch('/api/screenshare/token', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ role: 'manager', employeeId: emp.id }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    ({ token, livekitUrl } = await r.json());
  } catch (e) {
    console.error(`[livekit] token error for ${emp.id}:`, e.message);
    setCardError(emp.id, 'Token error');
    return;
  }

  const room = new LivekitClient.Room({
    adaptiveStream: true,
    dynacast:       true,
  });

  // Initialise the rooms entry before attaching events so handlers can safely
  // read/write rooms[emp.id] without null-checking the entry itself.
  rooms[emp.id] = { room, videoTrack: null, state: 'offline', intentionalDisconnect: false };

  // ── Track subscribed — employee's screen arrived ──────────────────────────
  room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, _pub, participant) => {
    if (track.kind !== LivekitClient.Track.Kind.Video) return;
    console.log(`[livekit] track subscribed from ${participant.identity} for ${emp.id}`);

    const videoEl = document.getElementById(`video-${emp.id}`);
    if (!videoEl) return;

    track.attach(videoEl);
    videoEl.muted = true;
    videoEl.style.display = 'block';

    const ph = document.getElementById(`ph-${emp.id}`);
    if (ph) ph.style.display = 'none';

    rooms[emp.id].videoTrack = track;
    setCardState(emp.id, 'live');
    setLockOverlay(emp.id, false); // clear lock overlay when video arrives

    // Mirror to fullscreen modal if it is open for this employee
    if (fsEmployeeId === emp.id) attachTrackToFullscreen(track);
  });

  // ── Track unsubscribed — employee stopped / paused sharing ────────────────
  room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
    if (track.kind !== LivekitClient.Track.Kind.Video) return;
    track.detach();
    if (rooms[emp.id]) rooms[emp.id].videoTrack = null;
    clearVideoEl(emp.id);
    setCardState(emp.id, 'offline');
  });

  // ── Participant connected — employee joined the room ──────────────────────
  room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
    console.log(`[livekit] participant connected: ${participant.identity} (${emp.id})`);
    setCardState(emp.id, 'connecting');
    setCardError(emp.id, '');
  });

  // ── Participant disconnected — employee left the room ─────────────────────
  room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
    console.log(`[livekit] participant disconnected: ${participant.identity} (${emp.id})`);
    clearVideoEl(emp.id);
    setCardState(emp.id, 'offline');
  });

  // ── Room disconnected — network error or server closed the room ───────────
  room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
    console.log(`[livekit] room disconnected for ${emp.id}, reason:`, reason);
    clearVideoEl(emp.id);
    setCardState(emp.id, 'offline');
    // Auto-reconnect unless the manager intentionally disconnected
    if (!rooms[emp.id]?.intentionalDisconnect) {
      setTimeout(() => reconnectEmployee(emp), 4000);
    }
  });

  // ── Connect ───────────────────────────────────────────────────────────────
  try {
    setCardState(emp.id, 'connecting');
    await room.connect(livekitUrl, token);
    console.log(`[livekit] connected to room ${room.name} for employee ${emp.id}`);

    // If no track arrived during connect (employee not yet sharing), go offline
    if (!rooms[emp.id]?.videoTrack) setCardState(emp.id, 'offline');
  } catch (e) {
    console.error(`[livekit] connect error for ${emp.id}:`, e.message);
    setCardError(emp.id, 'Connection failed');
    setCardState(emp.id, 'offline');
  }
}

// Tear down the current room entry and open a fresh connection
async function reconnectEmployee(emp) {
  if (rooms[emp.id]) {
    rooms[emp.id].room.removeAllListeners();
    try { rooms[emp.id].room.disconnect(); } catch {}
    delete rooms[emp.id];
  }
  await connectEmployee(emp);
}

// Clear the video element and placeholder back to waiting state
function clearVideoEl(empId) {
  const videoEl = document.getElementById(`video-${empId}`);
  const ph      = document.getElementById(`ph-${empId}`);
  if (videoEl) { videoEl.srcObject = null; videoEl.style.display = 'none'; }
  if (ph)      ph.style.display = 'flex';
  if (rooms[empId]) rooms[empId].videoTrack = null;
}

function disconnectEmployee(empId) {
  if (rooms[empId]) {
    rooms[empId].intentionalDisconnect = true;
    rooms[empId].room.removeAllListeners();
    try { rooms[empId].room.disconnect(); } catch {}
    delete rooms[empId];
  }
  clearVideoEl(empId);
  setCardState(empId, 'offline');
}

// ── Card state helpers ────────────────────────────────────────────────────────
function setCardState(empId, state) {
  if (rooms[empId]) rooms[empId].state = state;

  const card    = document.getElementById(`card-${empId}`);
  const dot     = document.getElementById(`dot-${empId}`);
  const badge   = document.getElementById(`badge-${empId}`);
  const sbDot   = document.querySelector(`#sb-${empId} .emp-dot`);
  const btnDisc = document.getElementById(`btn-disc-${empId}`);

  if (dot)   dot.className   = `card-dot ${state}`;
  if (sbDot) sbDot.className = `emp-dot ${state}`;

  if (badge) {
    badge.className   = `card-status-badge badge-${state}`;
    badge.textContent = { live:'Live', connecting:'Connecting…', offline:'Offline' }[state] || state;
  }
  if (card) {
    card.classList.remove('card-live', 'card-connecting');
    if (state === 'live')       card.classList.add('card-live');
    if (state === 'connecting') card.classList.add('card-connecting');
  }
  if (btnDisc) btnDisc.style.display = (state === 'live') ? '' : 'none';

  // Auto force-reconnect if card stays "connecting" for more than 15 s
  clearTimeout(connectingTimers[empId]);
  if (state === 'connecting') {
    connectingTimers[empId] = setTimeout(() => {
      if ((rooms[empId] || {}).state === 'connecting') {
        console.log(`[auto-reconnect] ${empId} stuck connecting — triggering force reconnect`);
        forceReconnect(empId);
      }
    }, 15_000);
  }

  // Update fullscreen badge if open for this employee
  if (fsEmployeeId === empId) {
    const fb = document.getElementById('fs-badge');
    if (fb) { fb.className = `badge-${state}`; fb.textContent = badge?.textContent || ''; }
  }
}

function setCardError(empId, msg) {
  const el = document.getElementById(`err-${empId}`);
  if (el) el.textContent = msg;
}

// ── Fullscreen ────────────────────────────────────────────────────────────────
function attachTrackToFullscreen(track) {
  const fsV = document.getElementById('fs-video');
  if (!fsV) return;
  track.attach(fsV);
  fsV.muted = true;
  fsV.play().catch(() => {});
}

function openFullscreen(empId) {
  const emp = employees.find(e => e.id === empId);
  if (!emp) return;

  fsEmployeeId = empId;
  document.getElementById('fs-name').textContent = emp.name;
  const fb = document.getElementById('fs-badge');
  fb.className   = `badge-${rooms[empId]?.state || 'offline'}`;
  fb.textContent = document.getElementById(`badge-${empId}`)?.textContent || '';

  const track = rooms[empId]?.videoTrack;
  const fsV   = document.getElementById('fs-video');
  if (track) {
    attachTrackToFullscreen(track);
  } else if (fsV) {
    fsV.srcObject = null;
  }

  document.getElementById('fullscreen-modal').classList.add('show');
}

function closeFullscreen() {
  if (fsEmployeeId) {
    const track = rooms[fsEmployeeId]?.videoTrack;
    const fsV   = document.getElementById('fs-video');
    if (track && fsV) {
      try { track.detach(fsV); } catch {}
    }
    if (fsV) fsV.srcObject = null;
  }
  fsEmployeeId = null;
  document.getElementById('fullscreen-modal').classList.remove('show');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Screen-lock overlay ───────────────────────────────────────────────────────
function setLockOverlay(empId, locked) {
  const overlay = document.getElementById(`lo-${empId}`);
  if (overlay) overlay.style.display = locked ? 'flex' : 'none';
}

// ── Attendance polling — checkout overlay ─────────────────────────────────────
// Maps empId → 'working' | 'checked_out'  (undefined = never seen)
const attendanceState  = {};
let   attendancePollTimer = null;

async function pollAttendance() {
  const date = new Date().toISOString().split('T')[0];
  try {
    const r = await fetch(`/api/attendance/all/${date}`, { credentials: 'same-origin' });
    if (!r.ok) return;
    const records = await r.json();

    // Build lookup: username → { checkedOut, outTime }
    const lookup = {};
    for (const rec of records) {
      const openCO = (rec.checkOuts || []).find(co => co.outTime && !co.inTime);
      lookup[rec.username] = { checkedOut: !!openCO, outTime: openCO ? openCO.outTime : '' };
    }

    for (const emp of employees) {
      const info         = lookup[emp.id] || { checkedOut: false, outTime: '' };
      const wasCheckedOut = attendanceState[emp.id] === 'checked_out';

      if (info.checkedOut && !wasCheckedOut) {
        // Newly checked out (or first poll and already out)
        attendanceState[emp.id] = 'checked_out';
        setCheckoutOverlay(emp.id, 'checked_out', info.outTime);

      } else if (!info.checkedOut && wasCheckedOut) {
        // Just checked back in — flash green for 3 s then hide
        attendanceState[emp.id] = 'working';
        setCheckoutOverlay(emp.id, 'checked_in', '');
        setTimeout(() => setCheckoutOverlay(emp.id, 'hidden', ''), 3000);
      }
    }
  } catch (e) {
    console.warn('[attendance] poll error:', e.message);
  }

  clearTimeout(attendancePollTimer);
  attendancePollTimer = setTimeout(pollAttendance, 30_000);
}

function setCheckoutOverlay(empId, state, outTime) {
  const overlay = document.getElementById(`co-${empId}`);
  const label   = document.getElementById(`co-label-${empId}`);
  const timeEl  = document.getElementById(`co-time-${empId}`);
  if (!overlay) return;

  if (state === 'hidden') {
    overlay.style.display = 'none';
    overlay.classList.remove('co-checkin');
    return;
  }

  if (state === 'checked_out') {
    overlay.classList.remove('co-checkin');
    if (label)  label.textContent = 'Checked Out';
    if (timeEl) timeEl.textContent = outTime ? `Since ${outTime}` : '';
  } else if (state === 'checked_in') {
    overlay.classList.add('co-checkin');
    if (label)  label.textContent = 'Checked In ✓';
    if (timeEl) timeEl.textContent = '';
  }

  overlay.style.display = 'flex';
}

// ── Force reconnect ───────────────────────────────────────────────────────────
// Silently asks the employee's Electron app to drop and re-establish its
// LiveKit connection. The employee sees no notification or UI change.
async function forceReconnect(empId) {
  try {
    const r = await fetch('/api/screenshare/force-reconnect', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ employeeId: empId }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      console.warn(`[forceReconnect] ${empId} failed:`, err.error || r.status);
    }
  } catch (e) {
    console.warn(`[forceReconnect] ${empId} error:`, e.message);
  }
}

// ── Util ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
