<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Rank Orbit</title>
<script>/* Theme before first paint — see /theme.js */(function(){var d=document.documentElement;try{var s=localStorage,u=s.getItem('ro_theme_user'),t=(u&&s.getItem('ro_theme:'+u))||s.getItem('ro_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t)}catch(e){d.setAttribute('data-theme','light')}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/design-system.css">
<script src="/theme.js"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Background ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 50%, color-mix(in srgb, var(--pink) 8%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 50%, color-mix(in srgb, var(--blue) 6%, transparent) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Topbar ── */
  .topbar { flex-shrink: 0; }

  /* ── Centered wrap ── */
  .login-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px 64px;
    position: relative; z-index: 1;
  }

  /* ── Card ── */
  .login-card {
    width: 100%; max-width: 420px;
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 36px;
    box-shadow: 0 8px 48px rgba(0,0,0,0.6), 0 0 80px color-mix(in srgb, var(--pink) 5%, transparent);
    backdrop-filter: blur(20px);
  }

  .card-logo {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; color: var(--on-accent);
    margin: 0 auto 20px;
    box-shadow: 0 0 24px var(--pink-glow);
  }
  .card-title {
    text-align: center; font-size: 22px; font-weight: 800;
    margin-bottom: 4px; letter-spacing: -0.3px;
  }
  .card-subtitle { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }

  /* ── Role indicator ── */
  .role-indicator {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    font-size: 13px; color: var(--text-muted);
  }
  .role-indicator .role-icon { font-size: 18px; }
  .role-indicator strong { color: var(--text); }

  /* ── Form ── */
  .form-fields { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }

  .inp-login {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .inp-login:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-dim); }
  .inp-login::placeholder { color: var(--text-dim); }
  .inp-login.error { border-color: var(--danger); }

  /* ── Info banner (password changed notice) ── */
  .info-msg {
    background: color-mix(in srgb, var(--blue) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px; color: var(--blue);
    text-align: center;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  /* ── Error message ── */
  .error-msg {
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px; color: var(--danger);
    text-align: center;
    display: none;
    animation: shake 0.35s ease;
  }
  .error-msg.show { display: block; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-3px); }
    80%     { transform: translateX(3px); }
  }

  /* ── Submit btn ── */
  .btn-signin {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--ro-accent-strong) 100%);
    color: var(--on-accent); border: none;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--pink-glow);
    transition: all 0.18s;
  }
  .btn-signin:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--pink-glow); }
  .btn-signin:active { transform: none; }
  .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .back-link {
    text-align: center; margin-top: 16px;
  }
  .back-link a {
    color: var(--text-muted); font-size: 12px; text-decoration: none;
    transition: color 0.15s;
  }
  .back-link a:hover { color: var(--pink); }

  /* ── Footer ── */
  .page-footer {
    text-align: center; padding: 12px;
    color: var(--text-dim); font-size: 11px;
    position: relative; z-index: 1;
  }
  .page-footer strong { color: var(--text-muted); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">RO</div>
  <div class="topbar-title">Rank <span>Orbit</span></div>
  <div class="topbar-right">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="card-logo">RO</div>
    <h1 class="card-title">Sign in to Rank Orbit</h1>
    <p class="card-subtitle">Use the username and password your manager gave you</p>

    <div class="info-msg" id="info-msg" style="display:none"></div>

    <div class="role-indicator" id="role-indicator" hidden>
      <span class="role-icon">🔐</span>
      <span>Opening the <strong id="role-label"></strong></span>
    </div>

    <div class="form-fields">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="inp-username" class="inp-login" placeholder="e.g. ali.lodhi" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="inp-password" class="inp-login" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn-signin" id="btn-signin" onclick="submitLogin()">Sign In</button>

    <div class="back-link">
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>

<div class="page-footer">Built by <strong>Abdullah Saleem</strong></div>

<script>
  const params = new URLSearchParams(window.location.search);

  // Show password-changed notice if redirected from a forced logout
  if (params.get('reason') === 'password_changed') {
    const infoEl = document.getElementById('info-msg');
    infoEl.textContent = '🔑 Your password has been changed. Please log in with your new password.';
    infoEl.style.display = 'block';
  }
  if (params.get('reason') === 'deactivated') {
    const infoEl = document.getElementById('info-msg');
    infoEl.textContent = 'Your account has been deactivated. Please contact your manager.';
    infoEl.style.display = 'block';
  }

  // Which portal was chosen on the homepage (wording only — your account decides where you land)
  const portal = params.get('portal') || ({ manager: 'manager', assistant: 'manager' })[params.get('role')] || '';
  if (portal === 'manager' || portal === 'member') {
    const ind = document.getElementById('role-indicator');
    document.getElementById('role-label').textContent = portal === 'manager' ? 'Manager Dashboard' : 'Member Portal';
    ind.querySelector('.role-icon').textContent = portal === 'manager' ? '📊' : '👤';
    ind.hidden = false;
  }

  async function submitLogin() {
    const username = document.getElementById('inp-username').value.trim();
    const password = document.getElementById('inp-password').value;

    if (!username || !password) {
      showError('Please enter your username and password.');
      return;
    }

    const btn = document.getElementById('btn-signin');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="border-top-color:var(--on-accent);width:14px;height:14px;margin-right:6px;vertical-align:middle;"></span> Signing in…';
    hideError();

    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        credentials: 'same-origin',
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.redirect;
      } else {
        showError(data.error || 'Invalid credentials. Please try again.');
      }
    } catch {
      showError('Could not reach the server. Check your connection.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    ['inp-username','inp-password'].forEach(id => document.getElementById(id).classList.add('error'));
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
    document.getElementById('error-msg').style.display = 'none';
    ['inp-username','inp-password'].forEach(id => document.getElementById(id).classList.remove('error'));
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLogin();
  });

  ['inp-username','inp-password'].forEach(id => {
    document.getElementById(id).addEventListener('input', hideError);
  });
</script>
</body>
</html>
